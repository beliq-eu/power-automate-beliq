name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  connector:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'
      - name: Install checkers
        run: pip install -r requirements-dev.txt
      - name: Connector definition
        run: python scripts/check_connector.py

  guard:
    uses: beliq-eu/.github/.github/workflows/guard.yml@6a7430b0ec6fb94506862b5460343d2d04873cb1 # main
